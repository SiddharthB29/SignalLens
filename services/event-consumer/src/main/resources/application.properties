spring.application.name=event-consumer
server.port=8081
# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group
spring.kafka.consumer.group-id=signallens-event-consumer

# Consumer Deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# SignalLens Kafka Topic
signallens.kafka.topic=signallens.events

# JSON Deserialization Target
spring.kafka.consumer.properties.spring.json.value.default.type=com.signallens.consumer.model.IngestedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Trusted Packages for JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.signallens.consumer.model

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/signallens
spring.datasource.username=signaladmin
spring.datasource.password=${signallens_db_pswrd}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true